name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: reps
          POSTGRES_PASSWORD: reps
          POSTGRES_DB: reps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked # fail if uv.lock is out of date with pyproject.toml
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6 # gen:api imports the backend to export its schema
      - run: npm ci
      - name: Check generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/generated \
            || { echo "::error::API types are stale. Run 'npm run gen:api' in frontend/ and commit."; exit 1; }
      - run: npm run lint
      - run: npm test
      - run: npm run build
