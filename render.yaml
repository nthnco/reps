# Render Blueprint: the app's hosting config. The database lives on Neon;
# its connection string is entered in the Render dashboard (sync: false keeps
# it out of git).
services:
  - type: web
    name: reps
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD_HASH # from `uv run python -m app.hash_password`
        sync: false
      - key: SECRET_KEY # signs the login cookie; Render generates it once
        generateValue: true
